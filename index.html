<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frisco Diwali 2026 – Annakut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#FBF7F0;--card:#FFFFFF;--ink:#2B2118;--mute:#6B5E52;--acc:#C25A00;--acc2:#A64B00;--soft:#FBEBD9;--line:#EADFCF;--on:#fff;--ok:#1f8a4c;--bad:#c0392b;
--hd:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--bd:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120E;--card:#1F1A15;--ink:#F4EBDD;--mute:#B5A998;--acc:#F2A049;--acc2:#F5B46C;--soft:#2B2218;--line:#352C22;--on:#1a1100;--ok:#5BD08B;--bad:#FF7B6B}}
:root[data-theme="dark"]{--bg:#15120E;--card:#1F1A15;--ink:#F4EBDD;--mute:#B5A998;--acc:#F2A049;--acc2:#F5B46C;--soft:#2B2218;--line:#352C22;--on:#1a1100;--ok:#5BD08B;--bad:#FF7B6B}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 var(--bd);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-25vmax;top:-25vmax;background:#F2A049}
.bg i:nth-child(2){right:-30vmax;top:35vh;background:#FFD79A;animation-duration:32s;animation-delay:-8s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(10vmax,6vmax) scale(1.12)}100%{transform:translate(-6vmax,12vmax) scale(.96)}}
.wrap{max-width:620px;margin:0 auto;padding:14px 18px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font:800 1rem var(--hd);color:var(--acc2)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:.9rem}
h2{font:800 2rem/1.1 var(--hd);margin:6px 0 4px}
h3{font:800 1.2rem/1.2 var(--hd);margin:0 0 6px}
.lead{margin:0 0 18px;color:var(--mute)}
.sec{font:800 1.35rem var(--hd);margin:36px 0 4px}
.sub{margin:0 0 12px;color:var(--mute);font-size:.95rem}
.cover{position:relative;border-radius:24px;overflow:hidden;min-height:340px;background-size:cover;background-position:center 35%;display:flex;align-items:flex-end}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,12,4,.88))}
.ct{position:relative;z-index:1;padding:22px 20px;color:#fff}
.ct h1{font:800 clamp(2rem,9vw,2.8rem)/1.05 var(--hd);margin:6px 0 6px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.ct p{margin:0;color:#FFE7B8;font-weight:600}
.flame{font-size:2.2rem;line-height:1;filter:drop-shadow(0 0 14px #FFB52E)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile,.lnk,.panel{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:128px}
.tile b{font:800 1.15rem/1.15 var(--hd)}
.tile span{font-size:.92rem;color:var(--mute);line-height:1.35}
.tile small{margin-top:auto;font-weight:800;color:var(--acc2);font-size:.8rem}
@media (hover:hover){.tile:hover,.lnk:hover{transform:scale(1.04);box-shadow:0 14px 30px -14px rgba(60,30,0,.4);border-color:var(--acc);position:relative;z-index:2}.panel:hover{transform:scale(1.015);box-shadow:0 12px 28px -16px rgba(60,30,0,.35)}}
.tile:active,.lnk:active{transform:scale(.98)}
.lnks{display:flex;flex-direction:column;gap:10px}
.lnk{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.lnk b{display:block;font:800 1.12rem/1.2 var(--hd)}
.lnk span{display:block;font-size:.92rem;color:var(--mute);margin-top:2px}
.lnk small{display:inline-block;margin-top:8px;font:800 .75rem var(--bd);color:var(--acc2);background:var(--soft);border-radius:99px;padding:2px 10px}
.back{background:none;border:0;color:var(--acc2);font-weight:800;padding:8px 0}
.big,.alt{display:block;width:100%;border-radius:14px;padding:14px 18px;font:800 1.12rem var(--hd);border:2px solid var(--acc);margin-top:14px;transition:transform .2s}
.big{background:var(--acc);color:var(--on)}
.alt{background:transparent;color:var(--acc2)}
@media (hover:hover){.big:hover,.alt:hover{transform:scale(1.03)}}
.stat{margin:0 0 10px;color:var(--mute);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.panel p{margin:6px 0}
.panel ul{margin:6px 0;padding-left:1.2em}
.panel li{margin:5px 0}
.pic{display:block;width:100%;height:auto;border-radius:12px;margin:-2px 0 12px}
.q{font:800 1.3rem/1.25 var(--hd);margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:600;transition:transform .2s,border-color .2s}
@media (hover:hover){.opt:not(:disabled):hover{transform:scale(1.02);border-color:var(--acc)}}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.fact{margin:12px 0 0;color:var(--mute)}
.win{text-align:center;padding:18px 8px}
.win h3{font-size:1.5rem}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{min-height:84px;border-radius:14px;border:2px solid var(--acc);background:var(--acc);color:var(--on);font:800 1.6rem var(--hd);padding:8px;transition:transform .2s}
@media (hover:hover){.mc:hover{transform:scale(1.05)}}
.mc span{display:none;font:700 .92rem/1.25 var(--bd)}
.mc.up{background:var(--card);color:var(--ink);font-size:0;border-color:var(--line)}
.mc.up span{display:block}
.mc.ok{border-color:var(--ok)}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.tiles span{min-width:2.4rem;height:2.9rem;display:grid;place-items:center;background:var(--acc);color:var(--on);font:800 1.5rem var(--hd);border-radius:10px;padding:0 6px}
input{width:100%;font:800 1.3rem var(--hd);text-align:center;text-transform:uppercase;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}
.row .alt{margin-top:8px}
.chal{font:800 1.45rem/1.3 var(--hd);text-align:center;padding:12px 4px;min-height:9rem;display:grid;place-items:center}
.msg{min-height:1.5em;text-align:center;font-weight:800;margin:8px 0 0}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
svg.mandir{display:block;width:100%;max-width:360px;margin:8px auto}
svg.mandir *{transition:opacity .4s}
.unl{font-size:.95rem;color:var(--mute);margin:4px 0 0}
.diyas{display:flex;justify-content:space-between;gap:4px;margin:8px 0 2px;padding:10px 8px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.dy{background:none;border:0;padding:4px;border-radius:16px;transition:transform .2s}
@media (hover:hover){.dy:hover{transform:scale(1.15) translateY(-3px)}}
.dy svg{width:50px;height:50px;display:block}
.dy .fl{fill:#FFC83D;opacity:0;transform-origin:32px 34px;transform:scale(.4);transition:opacity .3s,transform .3s}
.dy .bw{fill:var(--acc)}
.dy.lit .fl{opacity:1;transform:scale(1);filter:drop-shadow(0 0 8px #FFB52E);animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(3deg)}}
.tl{margin:14px 0 0;padding:0;list-style:none}
.ev{display:grid;grid-template-columns:72px 26px 1fr;column-gap:6px}
.ev .t{text-align:right;font:800 1.05rem/1.2 var(--hd);padding-top:2px}
.ev .t small{display:block;font:600 .68rem/1.1 var(--bd);color:var(--mute)}
.ev .m{position:relative;border-left:2px dashed var(--line);margin-left:12px}
.ev .m::before{content:"";position:absolute;left:-8px;top:5px;width:12px;height:12px;background:var(--bg);border:2px solid var(--acc);transform:rotate(45deg)}
.ev .c{padding:0 0 20px 6px}
.ev .c em{display:block;font:800 .68rem var(--bd);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-style:normal}
.ev .c b{display:block;font:800 1.08rem/1.25 var(--hd)}
.ev .c span{font-size:.88rem;color:var(--mute)}
video{width:100%;border-radius:16px;background:#000;display:block}
.note{margin-top:30px;text-align:center;font-size:.88rem;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,620px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;z-index:5}
.tab{background:none;border:0;border-radius:12px;padding:10px 0;font:800 .82rem var(--hd);color:var(--mute);transition:background .25s,color .25s}
.tab.on{background:var(--acc);color:var(--on)}
@media (prefers-reduced-motion:reduce){.bg i,.dy.lit .fl{animation:none}.bar i,svg.mandir *,.tile,.lnk,.panel{transition:none}}
</style>
</head>

function route(){
  var h=location.hash.slice(1),tab=games[h]?'play':(pages[h]?h:'home');
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]===tab?' on':'')+'"'+(t[0]===tab?' aria-current="page"':'')+' onclick="location.hash=\''+t[0]+'\'">'+t[1]+'</button>'}).join('');
  if(games[h]){
    app.innerHTML='<button class="back" onclick="location.hash=\'play\'">‹ All games</button><h2>'+games[h].t+'</h2><div id="g"></div>';
    games[h].f($('#g'));
  }else{(pages[h]||home)(app)}
  window.scrollTo(0,0);
}

function home(el){
  var dy=[0,1,2,3,4].map(function(i){return '<button class="dy" aria-label="Light diya '+(i+1)+'" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="fl" d="M32 6 C41 19 41 28 32 35 C23 28 23 19 32 6Z"/><path class="bw" d="M4 36 H60 C60 51 47 60 32 60 C17 60 4 51 4 36Z"/></svg></button>'}).join('');
  var sch=EV.map(function(e){return '<li class="ev"><div class="t">'+e[0]+(e[1]?'<small>'+e[1]+'</small>':'')+'</div><div class="m"></div><div class="c"><em>'+e[2]+'</em><b>'+e[3]+'</b><span>'+e[4]+'</span></div></li>'}).join('');
  el.innerHTML='<section class="cover" style="background-image:url('+IMG+')" role="img" aria-label="The Annakut display with decorated murtis and a huge spread of sweets and food"><div class="ct"><div class="flame" aria-hidden="true">🪔</div><h1>Frisco Diwali 2026 – Annakut</h1><p>Welcome! Use this page while you wait in line.</p></div></section>'
  +'<div class="sec">What would you like to do?</div><p class="sub">Tap a card to start. Use the tabs at the bottom to come back.</p><div class="grid">'
  +go('play','Play games','Quiz, matching, building Akshardham and more.')
  +go('learn','Learn about Diwali','Stories, traditions and videos.')
  +go('activities','What can I do here?','Exhibition, food stalls, food drive.')
  +go('shayona','Visit our Shayona','A short video about the food.')+'</div>'
  +'<div class="sec">What is Annakut?</div><div class="panel"><img class="pic" src="'+IMG2+'" alt="An Annakut display with a mountain of sweets before the deities"><p><b>Annakut</b> means “mountain of food”. The day after Diwali is New Year, and devotees offer a huge variety of sweets and dishes to Bhagwan to say thank you. That is the display you see here today.</p></div>'
  +'<div class="sec">Light the diyas</div><p class="sub">Tap each diya to light it.</p><div class="diyas">'+dy+'</div><p class="stat" id="dm" style="margin-top:8px"></p>'
  +'<div class="sec" id="schedule">Today’s schedule</div><p class="sub">What is happening, when and where.</p><ol class="tl">'+sch+'</ol>'
  +'<div class="sec">Visit us again</div><div class="lnks">'+ext('https://www.baps.org/dallas/home','Visit our mandir in Irving!','Find timings, events and directions for the mandir.','baps.org')+'</div>'
  +'<p class="note">No login. Nothing is saved or collected.</p>';
  var lit=0;
  el.querySelectorAll('.dy').forEach(function(b){b.onclick=function(){
    var on=b.classList.toggle('lit');b.setAttribute('aria-pressed',on);lit+=on?1:-1;
    $('#dm').textContent=lit===5?'Happy Diwali!':lit?lit+' of 5 lit':'';
  }});
}
function play(el){
  el.innerHTML='<h2>Play games</h2><p class="lead">Quick games for the whole family. Pass the phone along the line.</p><div class="grid">'+Object.keys(games).map(function(k){var g=games[k];
    return '<button class="tile" onclick="location.hash=\''+k+'\'"><b>'+g.t+'</b><span>'+g.d+'</span><small>'+g.m+'</small></button>'}).join('')+'</div>';
}
function learn(el){
  el.innerHTML='<h2>Learn about Diwali</h2><p class="lead">Read the short guide below, then watch and read more.</p>'
  +'<div class="panel"><h3>Diwali in short</h3><ul><li>Diwali is the Festival of Lights.</li><li>It celebrates the victory of good over evil.</li><li>Families celebrate for five days with new clothes, sweets, prayers and lights.</li></ul></div>'
  +'<div class="panel"><h3>Five days of celebration</h3><ul><li><b>Dhan Teras</b> starts the festival. People pray to Goddess Laxmi for ethical prosperity and success in their careers.</li><li><b>Sharda Pujan</b> is when businesspeople and students purify their account books and school books for the year ahead.</li></ul></div>'
  +'<div class="panel"><h3>Stories behind Diwali</h3><ul><li>Shri Krishna defeated the demon Narkasur and freed people from captivity.</li><li>Goddess Laxmiji emerged from the ocean when the devas and asuras churned it in search of amrut.</li><li>Lord Pruthu drew goodness out of the Earth.</li><li>The Pandavas returned from 13 years of exile in the forest.</li><li>Shri Rama returned to Ayodhya after defeating Ravan in Lanka.</li></ul></div>'
  +'<div class="panel"><img class="pic" src="'+CR1+'" alt="Lit diyas along the front of the stage"><h3>Traditions</h3><ul><li>Light divos, small lamps, to ask Bhagwan to remove ignorance.</li><li>Decorate homes, mandirs and neighborhoods with lights.</li><li>Draw colorful rangoli at the door.</li><li>Forgive and forget the mistakes of the past year.</li></ul></div>'
  +'<div class="panel"><img class="pic" src="'+CR2+'" alt="A close view of sweets and snacks offered as Annakut"><h3>Annakut</h3><p>After Diwali comes New Year. Devotees offer a mountain of food, called Annakut, to Bhagwan in gratitude.</p></div>'
  +'<div class="sec">Watch and read more</div><div class="lnks">'
  +ext('https://www.youtube.com/@BAPS','Guruhari Darshan','Watch videos of our guru on the official YouTube channel.','YouTube')
  +ext('https://www.baps.org/cultureandheritage/Traditions/AnnualCelebrationsandFestivals/Diwali.aspx','Prasangs about Diwali','Read the full stories and history of Diwali.','baps.org')
  +ext('https://youtu.be/UwB1C0rTvaA?si=f_JgTqx2C7t6DlLr','Learn about our Guru','Watch a short video about our guru.','YouTube')+'</div>'
  +'<button class="big" onclick="location.hash=\'quiz\'">Test yourself with the quiz</button>';
}

  var A=[['Exhibition','Walk through the exhibition booths and discover the stories, values and culture behind the festival.'],['Food Stalls','Enjoy fresh vegetarian food at the food stalls.'],['Food Drive','Give back by joining the food drive. Ask a volunteer how to take part.'],['Learn more about our Sanstha','Find out who we are and what we do for communities around the world.']];
  el.innerHTML='<h2>What can I do here?</h2><p class="lead">Things to see, eat and do today. More will be added.</p>'+A.map(function(a){return '<div class="panel"><h3>'+a[0]+'</h3><p>'+a[1]+'</p></div>'}).join('')
  +'<div class="sec">Learn more</div><div class="lnks">'+ext('https://www.baps.org/About-BAPS.aspx','About our Sanstha','Read about our work and values.','baps.org')+ext('https://www.baps.org/dallas/home','Visit our mandir in Irving!','Find timings, events and directions for the mandir.','baps.org')+'</div>';
}
function shayona(el){
  el.innerHTML='<h2>Visit our Shayona!</h2><p class="lead">Watch the video, then come and enjoy the food.</p>'+(VID?'<video controls playsinline preload="metadata" src="/_blob/'+VID+'"></video>':'<div class="panel"><p>The video is on its way. Check back soon.</p></div>');
}

/* Quiz */
function quiz(el){
  var Q=[
  ['How many days is Diwali celebrated?',['Three','Five','Seven','Ten'],1,'Children and adults celebrate together for five days.'],
  ['Which day starts the festival with prayers to Goddess Laxmi?',['Sharda Pujan','Rathyatra','Dhan Teras','New Year'],2,'On Dhan Teras, devotees pray for ethical prosperity and success.'],
  ['Who performs Sharda Pujan?',['Only farmers','Businesspeople and students','Only priests','Sailors'],1,'They purify account books and school books for the year ahead.'],
  ['What do devotees light the night before Diwali?',['Divos','Bonfires','Kites','Lanterns on a river'],0,'Divos symbolize asking Bhagwan to remove ignorance and light up our souls.'],
  ['Diwali signifies the victory of…',['Summer over winter','Good over evil','Day over night','Hunger over plenty'],1,'It is the festival of lights and the victory of good over evil.'],
  ['What are the colorful designs made on porches called?',['Rangoli','Garba','Thali','Toran'],0,'Families make rangoli to welcome guests and Goddess Laxmi.'],
  ['Who returned to Ayodhya after defeating Ravan?',['Shri Krishna','Lord Pruthu','Shri Rama','The Pandavas'],2,'Shri Rama’s return is one of the stories behind Diwali.'],
  ['Laxmiji emerged from the ocean when the devas and asuras were…',['Sailing','Churning it for amrut','Building a bridge','Sleeping'],1,'This is the churning of the ocean, or samudra manthan.'],
  ['The Pandavas returned after how many years in exile?',['3','7','13','20'],2,'They spent 13 years in the forest before returning.'],
  ['A Diwali tradition is to forgive and forget the…',['Weather','Misdeeds of the past year','Old recipes','Homework'],1,'Starting the New Year with a clean slate is part of the festival.']];
  var i=0,s=0;
  function show(){
    if(i>=Q.length){var m=s>=9?'Diwali expert!':s>=6?'Well done!':'Good start!';
      el.innerHTML='<div class="panel win"><h3>'+m+' '+s+' of '+Q.length+'</h3><p>Pass the phone and see if someone else can beat it.</p><button class="big" id="again">Play again</button></div>'+ext('https://www.baps.org/cultureandheritage/Traditions/AnnualCelebrationsandFestivals/Diwali.aspx','Read more about Diwali','The source for these questions.');
      $('#again').onclick=function(){quiz(el)};return}
    var q=Q[i];
    el.innerHTML='<p class="stat">Question '+(i+1)+' of '+Q.length+' · Score '+s+'</p><div class="panel"><p class="q">'+q[0]+'</p>'+q[1].map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o+'</button>'}).join('')+'<p class="fact" id="ft"></p></div>';
    el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      var k=+b.dataset.k;if(k===q[2])s++;
      el.querySelectorAll('.opt').forEach(function(x,j){x.disabled=true;if(j===q[2])x.classList.add('good');else if(j===k)x.classList.add('wrong')});
      $('#ft').textContent=q[3];
      var n=document.createElement('button');n.className='big';n.textContent=i===Q.length-1?'See score':'Next question';
      n.onclick=function(){i++;show()};el.appendChild(n);
    }});
  }
  show();
}

/* Story Match */
function story(el){
  var P=[['Shri Rama','Returned to Ayodhya after defeating Ravan'],['Shri Krishna','Defeated the demon Narkasur'],['The Pandavas','Returned after 13 years in the forest'],['Goddess Laxmiji','Emerged from the ocean when it was churned'],['Sharda Pujan','Purifying account books and school books']];
  var deck=[];P.forEach(function(p,i){deck.push({id:i,t:p[0]});deck.push({id:i,t:p[1]})});deck=shuf(deck);
  var open=[],moves=0,done=0,lock=false;
  el.innerHTML='<p>Flip two cards. Match each story with who or what it belongs to.</p><p class="stat">Moves: <b id="mv">0</b> · Matched: <b id="dn">0</b> of '+P.length+'</p><div class="mt">'+deck.map(function(c,i){return '<button class="mc" data-i="'+i+'">?<span>'+c.t+'</span></button>'}).join('')+'</div><div id="msg"></div>';
  el.querySelectorAll('.mc').forEach(function(b){b.onclick=function(){
    if(lock||b.classList.contains('up'))return;
    b.classList.add('up');open.push(b);
    if(open.length===2){
      moves++;$('#mv').textContent=moves;
      var a=open[0],c=open[1];
      if(deck[a.dataset.i].id===deck[c.dataset.i].id){
        a.classList.add('ok');c.classList.add('ok');open=[];done++;$('#dn').textContent=done;
        if(done===P.length){$('#msg').innerHTML='<div class="panel win"><h3>All matched in '+moves+' moves!</h3><p>Now you know five stories and traditions of Diwali.</p><button class="big" id="again">Play again</button></div>';$('#again').onclick=function(){story(el)}}
      }else{lock=true;setTimeout(function(){a.classList.remove('up');c.classList.remove('up');open=[];lock=false},900)}
    }
  }});
}

/* Build Akshardham */
function build(el){
  var G=12500,STEP=125,v=0;
  var F=['Swaminarayan Akshardham stands in Robbinsville, New Jersey.','It is the third Akshardham, after Gandhinagar in Gujarat and Delhi.','In every stone you can find seva (service), shraddha (faith) and samvadita (culture).','It was built by unity: thousands of people coming together for one common goal.','Pramukh Swami Maharaj began the journey, and Mahant Swami Maharaj completed it.','12,500 volunteers served. The dedication ceremony was held on October 8, 2023.'];
  var T=['<rect x="20" y="170" width="260" height="22" rx="3"/>','<rect x="42" y="146" width="216" height="24" rx="3"/>','<rect x="64" y="122" width="172" height="24" rx="3"/>','<rect x="88" y="98" width="124" height="24" rx="3"/>','<rect x="112" y="74" width="76" height="24" rx="3"/>','<path d="M118 74 Q150 4 182 74 Z"/>'];
  el.innerHTML='<p>Every crew you send adds stones. Pass the phone so everyone adds a crew. Together you will build Akshardham, just as thousands of volunteers did.</p><svg class="mandir" viewBox="0 0 300 200" role="img" aria-label="A mandir being built tier by tier" fill="var(--acc)" stroke="var(--acc2)" stroke-width="2">'+T.map(function(t){return t.replace('/>',' opacity=".12"/>')}).join('')+'</svg>'
  +'<p class="stat" id="vs" style="text-align:center"></p><div class="bar"><i id="pb"></i></div><div class="panel" id="fc"><p>Send the first crew to begin.</p></div><button class="big" id="go">Send a crew of 125 volunteers</button>';
  function up(){
    var n=Math.floor(v/G*6),shapes=el.querySelectorAll('svg *');
    shapes.forEach(function(s,i){s.setAttribute('opacity',i<n?'1':'.12')});
    $('#vs').textContent='Volunteers: '+v.toLocaleString('en-US')+' of '+G.toLocaleString('en-US');
    $('#pb').style.width=v/G*100+'%';
    if(n>0)$('#fc').innerHTML='<h3>Tier '+Math.min(n,6)+' complete</h3><p>'+F[Math.min(n,6)-1]+'</p>'+(n>1?'<p class="unl">'+F.slice(0,n-1).join(' ')+'</p>':'');
  }
  $('#go').onclick=function(){
    v=Math.min(G,v+STEP);up();
    if(v>=G){$('#go').remove();el.insertAdjacentHTML('beforeend','<div class="panel win"><h3>Akshardham is complete!</h3><p>It was built by sacrifice, by unity and by thousands coming together. Many small efforts make a big difference.</p><button class="big" id="again">Build again</button></div>'+ext('https://www.baps.org/News/2023/Grand-Dedication-Ceremony-Swaminarayan-Akshardham-24217.aspx','Read about the dedication ceremony','The full story of October 8, 2023.'));$('#again').onclick=function(){build(el)}}
  };
  up();
}

/* Word Scramble */
function scramble(el){
  var W=[['DIVO','A small lamp lit at Diwali'],['SEVA','Selfless service'],['UNITY','Coming together as one'],['LAXMI','The Goddess who is welcomed at Diwali'],['RANGOLI','Colorful designs at the door'],['ANNAKUT','A mountain of food offered to Bhagwan'],['SHRADDHA','Faith'],['AARTI','A prayer with lights offered to Bhagwan'],['MANDIR','A Hindu temple'],['DIWALI','The Festival of Lights']];
  var order=shuf(W),i=0,s=0;
  function show(){
    if(i>=order.length){el.innerHTML='<div class="panel win"><h3>You solved '+s+' of '+order.length+'!</h3><button class="big" id="again">Play again</button></div>';$('#again').onclick=function(){scramble(el)};return}
    var w=order[i][0],sc=w;
    for(var t=0;t<20&&sc===w;t++)sc=shuf(w.split('')).join('');
    el.innerHTML='<p class="stat">Word '+(i+1)+' of '+order.length+' · Solved '+s+'</p><div class="panel"><div class="tiles" aria-label="Scrambled letters">'+sc.split('').map(function(l){return '<span>'+l+'</span>'}).join('')+'</div><input id="in" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your answer" placeholder="Type the word"><div class="msg" id="ms"></div><button class="big" id="go">Check</button><div class="row"><button class="alt" id="hn">Hint</button><button class="alt" id="sk">Skip</button></div></div>';
    function chk(){
      if($('#in').value.trim().toUpperCase()===w){s++;i++;$('#ms').textContent='Yes! '+w;setTimeout(show,700)}
      else{$('#ms').textContent='Not quite. Try again.'}
    }
    $('#go').onclick=chk;
    $('#in').onkeydown=function(e){if(e.key==='Enter')chk()};
    $('#hn').onclick=function(){$('#ms').textContent='Hint: '+order[i][1]+'. Starts with '+w[0]+'.'};
    $('#sk').onclick=function(){i++;show()};
  }
  show();
}

/* Line Challenges */
function challenge(el){
  var C=['Everyone shares a favorite Diwali memory. 15 seconds each.','Say “Happy Diwali” in as many languages as your group knows.','Each person names a sweet. No repeats.','Silent charades: act out a Diwali activity and let your family guess.','Each person shares one small act of seva they could do this week.','Name something you are grateful for, then pass it to the next person.','Count the lights or decorations you can spot nearby. Who finds the most?','Tell the story of the Tetodi bird in exactly five words, one person per word.','Give a compliment to the person next to you.','Name three things you can do together to make someone’s day brighter.','Everyone shows their biggest smile for 5 seconds.','Draw a diya in the air with your finger. Whose is best?'];
  var last=-1;
  el.innerHTML='<div class="panel"><div class="chal" id="ch" aria-live="polite">Tap the button for a challenge the whole line can try.</div></div><button class="big" id="nx">Give us a challenge</button>';
  $('#nx').onclick=function(){var k;do{k=Math.floor(Math.random()*C.length)}while(k===last);last=k;$('#ch').textContent=C[k];$('#nx').textContent='Another one'};
}
